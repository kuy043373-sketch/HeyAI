name: Build Hey AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Hey AI project
        run: |
          unzip -o HeyAI-Full-Ready.zip -d buildsrc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: buildsrc/HeyAI-Full
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeyAI-APK
          path: buildsrc/HeyAI-Full/app/build/outputs/apk/debug/app-debug.apk
