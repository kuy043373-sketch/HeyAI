name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract JARVIS project
        run: |
          unzip -o JARVIS-Full-NEW.zip -d buildsrc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Fix project
        working-directory: buildsrc/JARVIS-Full
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Fix Java/Kotlin JVM target
          path = Path("app/build.gradle.kts")
          text = path.read_text()

          if "compileOptions" not in text:
              text = text.replace(
                  "    defaultConfig {",
                  """    compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }

                  defaultConfig {"""
              )

          if "jvmTarget" not in text:
              text = text.replace(
                  "    defaultConfig {",
                  """    kotlinOptions {
                      jvmTarget = "17"
                  }

                  defaultConfig {"""
              )

          path.write_text(text)

          # Fix accidental Thai text inside MainActivity
          main = Path("app/src/main/java/com/jarvis/app/MainActivity.kt")
          code = main.read_text()

          code = code.replace("labelแล", "label")
          code = code.replace("labelในเคร", "label")

          main.write_text(code)

          print("Project fixes applied.")
          PY

      - name: Build APK
        working-directory: buildsrc/JARVIS-Full
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: buildsrc/JARVIS-Full/app/build/outputs/apk/debug/app-debug.apk
